version: '3.8'

services:
  chaos-bot:
    build: .
    container_name: chaos-bot-production
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RPC_URL=${RPC_URL}
      - NETWORK=mainnet-beta
      - DEFAULT_SLIPPAGE=100
      - PRIORITY_FEE=1000
      - MAX_RETRIES=3
      - WEB_PORT=3000
      - LOG_LEVEL=info
      - ENABLE_DEBUG=false
      - MAX_TRADES_PER_MINUTE=50
      - MAX_WALLETS_PER_OPERATION=100
      - MAX_SOL_PER_TRADE=10
      - RPC_POOL_SIZE=4
      - RPC_TIMEOUT=30000
      - RPC_RETRY_ATTEMPTS=3
      - CACHE_TTL=300000
      - ENABLE_CACHE=true
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - chaos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: chaos-bot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - chaos-bot
    networks:
      - chaos-network

  redis:
    image: redis:alpine
    container_name: chaos-bot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - chaos-network
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus
    container_name: chaos-bot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - chaos-network

  grafana:
    image: grafana/grafana
    container_name: chaos-bot-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - chaos-network

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  chaos-network:
    driver: bridge
