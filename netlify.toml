[build]
  publish = "webapp"
  command = "echo 'Production build complete'"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["volume-wallets-public.json", "pump-wallets-public.json", "groups-config.json"]

[dev]
  command = "cd webapp && node api-server.js"
  port = 3000
  publish = "webapp"

