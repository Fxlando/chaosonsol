<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Chaos Bot Trading Platform...</title>
    <meta http-equiv="refresh" content="0;url=trading-ui.html">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .redirect-message {
            text-align: center;
        }
        .redirect-message h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .redirect-message p {
            color: #9ca3af;
            margin-bottom: 1.5rem;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #232330;
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #8b5cf6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>⚡ Chaos Bot</h1>
        <p>Redirecting to Professional Trading Platform...</p>
        <div class="loader"></div>
        <p style="margin-top: 2rem; font-size: 0.9rem;">
            If you're not redirected, <a href="trading-ui.html">click here</a>
        </p>
    </div>
    <script>
        // Immediate redirect
        window.location.href = 'trading-ui.html';
    </script>
</body>
</html>
