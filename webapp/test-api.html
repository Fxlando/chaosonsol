<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Testing Netlify Functions</h1>
    <button onclick="testStats()">Test Stats</button>
    <button onclick="testWallets()">Test Wallets</button>
    <pre id="result"></pre>

    <script>
        async function testStats() {
            const result = document.getElementById('result');
            result.textContent = 'Loading...';
            try {
                const response = await fetch('/.netlify/functions/stats');
                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            }
        }

        async function testWallets() {
            const result = document.getElementById('result');
            result.textContent = 'Loading...';
            try {
                const response = await fetch('/.netlify/functions/wallets');
                const data = await response.json();
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
